<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chấm công Hải Anh</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    #root {
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 24px;
      margin: 20px 0 10px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
    }

    input,
    select {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      margin: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 12px;
    }

    th,
    td {
      border: 1px solid #cbd5e1;
      padding: 10px;
    }

    th {
      background: #e2e8f0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
